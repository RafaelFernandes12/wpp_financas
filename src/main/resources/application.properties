spring.application.name=wpp_financas

# Banco: lê de variáveis de ambiente; se não existirem, usa o valor depois dos dois pontos
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:wpp_financas}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
